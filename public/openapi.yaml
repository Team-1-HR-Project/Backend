openapi: 3.0.3
info:
  title: HR API Documentation
  version: 1.0.0
  description: Backend API
servers:
- url: http://127.0.0.1:8000
  description: Local Development Server
- url: https://hr-system.iptvdemo.serv5group.com
  description: Production Server (Staging/Live)
tags:
- name: Authentication
- name: Permissions
- name: Employees
- name: Departments
- name: Managers
- name: Notifications
- name: Broadcasting
- name: Files
paths:
  /api/auth/login:
    post:
      summary: Login (This route is allowed for all roles) 📱
      operationId: login
      tags:
      - Authentication
      parameters:
      - in: header
        name: Accept
        required: true
        schema:
          type: string
          default: application/json
        example: application/json
      - in: header
        name: Accept-Language
        required: false
        schema:
          type: string
          enum:
          - ar
          - en
      - in: query
        name: lang
        required: false
        description: Language for response translation (e.g. ar, en)
        schema:
          type: string
          enum:
          - ar
          - en
          default: en
        example: en
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                  example: noni@gmail.com
                password:
                  type: string
                  example: secret123
      responses:
        "200":
          description: Logged in successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Logged in successfully.
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                      token_type:
                        type: string
                        example: bearer
                      expires_in:
                        type: string
                        example: 24 hours
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 6
                          name:
                            type: string
                            example: Noran Baligh
                          email:
                            type: string
                            format: email
                            example: noran@gmail.com
                          phone:
                            type: string
                            nullable: true
                            example: "01019018137"
                          employee_code:
                            type: string
                            nullable: true
                            example: EMP-2026-24271
                          job_title:
                            type: string
                            nullable: true
                            example: Frontend Developer
                          employment_type:
                            type: string
                            nullable: true
                            example: Part-time
                          start_date:
                            type: string
                            format: date
                            nullable: true
                            example: 2026-09-01
                          status:
                            type: string
                            nullable: true
                            example: Active
                          address:
                            type: string
                            nullable: true
                            example:
                          avatar_url:
                            type: string
                            nullable: true
                            example: http://127.0.0.1:8000/api/files/2/download
                          role:
                            type: string
                            example: Employee
                          role_label:
                            type: string
                            nullable: true
                            example: Employee
                          locale:
                            type: string
                            example: en
                          permissions:
                            type: array
                            items:
                              type: string
                            example:
                            - View Profile
                            - Update Profile
                            - View Departments
                            - Update Task Progress
                            - Update Task Status
                            - Create Submission
                            - Attach File to Submission
                            - View Submission
                            - Resubmit Submission
                            - View Active Locations
                            - Check-in / Check-out
                            - View Personal Attendance History
                            - View Own Goals
                            - Create Goal
                            - Update Goal
                            - Update Goal Progress
                            - Complete Goal
                            - View Personal Evaluation
                            - Personal Performance Dashboard
                            - View Leave Types
                            - View Leave Balances
                            - View Own Leave Requests
                            - Create Leave Request
                            - Cancel Leave Request
                            - View Leave History
                            - View Leave Calendar
                            - Download Files
                            - Delete Files
                          created_at:
                            type: string
                            example: 2026-09-20 18:28:17
              example:
                success: true
                message: Logged in successfully.
                data:
                  access_token: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJodHRwOi8vMTI3LjAuMC4xOjgwMDAvYXBpL2F1dGgvbG9naW4iLCJpYXQiOjE3ODk5MjU5MjgsImV4cCI6MTc5MDAxMjMyOCwibmJmIjoxNzg5OTI1OTI4LCJqdGkiOijjRFgybTV4OEVWUU9sM3JGIiwic3ViIjoiNiIsInBydiI6IjIzYmQ1Yzg5NDlmNjAwYWRiMzllNzAxYzQwMDg3MmRiN2E1OTc2ZjciLCJyb2xlIjoiRW1wbG95ZWUifQ.4DnPJEF0SlWspAYc4y6aHE8g_A9O_Hgh-je4bLDvVSM
                  token_type: bearer
                  expires_in: 24 hours
                  user:
                    id: 6
                    name: Noran Baligh
                    email: noran@gmail.com
                    phone: "01019018137"
                    employee_code: EMP-2026-24271
                    job_title: Frontend Developer
                    employment_type: Part-time
                    start_date: 2026-09-01
                    status: Active
                    address:
                    avatar_url: http://127.0.0.1:8000/api/files/2/download
                    role: Employee
                    role_label: Employee
                    locale: en
                    permissions:
                    - View Profile
                    - Update Profile
                    - View Departments
                    - Update Task Progress
                    - Update Task Status
                    - Create Submission
                    - Attach File to Submission
                    - View Submission
                    - Resubmit Submission
                    - View Active Locations
                    - Check-in / Check-out
                    - View Personal Attendance History
                    - View Own Goals
                    - Create Goal
                    - Update Goal
                    - Update Goal Progress
                    - Complete Goal
                    - View Personal Evaluation
                    - Personal Performance Dashboard
                    - View Leave Types
                    - View Leave Balances
                    - View Own Leave Requests
                    - Create Leave Request
                    - Cancel Leave Request
                    - View Leave History
                    - View Leave Calendar
                    - Download Files
                    - Delete Files
                    created_at: 2026-09-20 18:28:17
        "403":
          description: Forbidden (e.g. Account inactive)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Your account is inactive. Please activate your account first.
        "422":
          description: Validation error or invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Validation error
              examples:
                invalidCredentials:
                  summary: Invalid Credentials
                  value:
                    success: false
                    message: The email address field is required. The password field is required.
        "429":
          description: Too Many Requests (Throttle limit exceeded)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Too many login attempts. Please try again in 60 seconds.
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Something went wrong
  /api/auth/logout:
    post:
      summary: Logout (This route is allowed for all roles) 📱
      operationId: logout
      tags:
      - Authentication
      security:
      - bearerAuth: []
      parameters:
      - in: header
        name: Accept
        required: true
        schema:
          type: string
          default: application/json
        example: application/json
      - in: header
        name: Accept-Language
        required: false
        schema:
          type: string
          enum:
          - ar
          - en
      - in: query
        name: lang
        required: false
        description: Language for response translation (e.g. ar, en)
        schema:
          type: string
          enum:
          - ar
          - en
          default: en
        example: en
      responses:
        "200":
          description: Successfully logged out.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Logged out successfully.
                  data:
                    type: array
                    items:
                      type: string
                    example: []
              example:
                success: true
                message: Logged out successfully.
                data: []
        "401":
          description: Missing, expired, or invalid token (Unauthenticated).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Unauthenticated. Please log in first.
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Something went wrong
  /api/auth/google/redirect:
    get:
      summary: Google Login (Only For Role Owner)
      operationId: googleRedirect
      tags:
      - Authentication
      parameters:
      - in: header
        name: Accept
        required: true
        schema:
          type: string
          default: application/json
        example: application/json
      - in: header
        name: Accept-Language
        required: false
        schema:
          type: string
          enum:
          - ar
          - en
      responses:
        "200":
          description: Google redirect URL generated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      url:
                        type: string
              example:
                success: true
                message: Google redirect URL generated successfully
                data:
                  url: https://accounts.google.com/o/oauth2/v2/auth?client_id=123456789.apps.googleusercontent.com&redirect_uri=http%3A%2F%2Flocalhost%3A8000%2Fapi%2Fauth%2Fgoogle%2Fcallback&response_type=code&scope=openid+profile+email
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/permissions:
    get:
      summary: Retrieve all permissions (This route is allowed for roles Owner, HR)
      description: Returns a list of all permission labels translated based on the requested language. Requires authentication and Owner or HR role
      operationId: getPermissions
      tags:
      - Permissions
      security:
      - bearerAuth: []
      parameters:
      - in: header
        name: Accept
        required: true
        schema:
          type: string
          default: application/json
        example: application/json
      - in: header
        name: Accept-Language
        required: false
        schema:
          type: string
          enum:
          - ar
          - en
      - in: query
        name: lang
        required: false
        description: Language for response translation (e.g. ar, en)
        schema:
          type: string
          enum:
          - ar
          - en
          default: en
        example: en
      responses:
        "200":
          description: Permissions list retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Permissions list retrieved successfully
                  data:
                    type: array
                    items:
                      type: string
                    example:
                    - view_dashboard
                    - manage_employees
                    - create_roles
              example:
                success: true
                message: Permissions list retrieved successfully
                data:
                - view_dashboard
                - manage_employees
                - create_roles
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Unauthenticated. Please log in first.
              example:
                success: false
                message: Unauthenticated. Please log in first.
        "403":
          description: Forbidden - User does not have Owner or HR role
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: You do not have the required permissions to perform this action.
              example:
                success: false
                message: You do not have the required permissions to perform this action.
        "500":
          description: Failed to retrieve permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Failed to retrieve permissions
              example:
                success: false
                message: Failed to retrieve permissions
  /api/employees:
    get:
      summary: "List all employees (This Route Allowed For Owner / HR Only)"
      description: "Retrieve a paginated list of employees with optional filters for search, status, department, manager, employment type, and role."
      operationId: getAllEmployees
      tags:
      - Employees
      security:
      - bearerAuth: []
      parameters:
      - in: header
        name: Accept
        required: true
        schema:
          type: string
          default: application/json
        example: application/json
      - in: header
        name: Accept-Language
        required: false
        schema:
          type: string
          enum:
          - ar
          - en
      - in: query
        name: search
        required: false
        description: Search by name, email, employee ID, job title, or phone
        schema:
          type: string
        example: John
      - in: query
        name: status
        required: false
        schema:
          type: string
          enum:
          - Active
          - Inactive
        example: Active
      - in: query
        name: department_id
        required: false
        schema:
          type: integer
        example: 1
      - in: query
        name: manager_id
        required: false
        schema:
          type: integer
        example: 3
      - in: query
        name: employment_type
        required: false
        schema:
          type: string
          enum:
          - Full-time
          - Part-time
          - Contract
        example: Full-time
      - in: query
        name: role
        required: false
        schema:
          type: string
        example: Employee
      - in: query
        name: per_page
        required: false
        schema:
          type: integer
          default: 15
        example: 15
      - in: query
        name: page
        required: false
        schema:
          type: integer
          default: 1
        example: 1
      responses:
        "200":
          description: Employees retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Employees retrieved successfully.
                  data:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      first_page_url:
                        type: string
                        example: "https://hr-system.iptvdemo.serv5group.com/api/employees?page=1"
                      from:
                        type: integer
                        nullable: true
                        example: 1
                      last_page:
                        type: integer
                        example: 2
                      last_page_url:
                        type: string
                        example: "https://hr-system.iptvdemo.serv5group.com/api/employees?page=2"
                      links:
                        type: array
                        items:
                          type: object
                          properties:
                            url:
                              type: string
                              nullable: true
                            label:
                              type: string
                            active:
                              type: boolean
                      next_page_url:
                        type: string
                        nullable: true
                        example: "https://hr-system.iptvdemo.serv5group.com/api/employees?page=2"
                      path:
                        type: string
                        example: "https://hr-system.iptvdemo.serv5group.com/api/employees"
                      per_page:
                        type: integer
                        example: 15
                      prev_page_url:
                        type: string
                        nullable: true
                        example:
                      to:
                        type: integer
                        nullable: true
                        example: 15
                      total:
                        type: integer
                        example: 22
                      employees:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 25
                            name:
                              type: string
                              example: Tala
                            email:
                              type: string
                              format: email
                              example: talabaligh@gmail.com
                            phone:
                              type: string
                              nullable: true
                              example: "+201114356906"
                            employee_code:
                              type: string
                              nullable: true
                              example: EMP-2026-87711
                            job_title:
                              type: string
                              nullable: true
                              example: Flutter Developer
                            employment_type:
                              type: string
                              nullable: true
                              example: Full-time
                            start_date:
                              type: string
                              format: date
                              nullable: true
                              example: "2026-09-01"
                            status:
                              type: string
                              nullable: true
                              example: Inactive
                            address:
                              type: string
                              nullable: true
                              example:
                            avatar_url:
                              type: string
                              nullable: true
                              example:
                            role:
                              type: string
                              example: Employee
                            role_label:
                              type: string
                              nullable: true
                              example: Employee
                            locale:
                              type: string
                              example: en
                            department:
                              type: object
